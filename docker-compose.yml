version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: church-scheduler-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: church_scheduler
      POSTGRES_USER: church_admin
      POSTGRES_PASSWORD: church_admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: dourak-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      # Passed through to the realm import (${env.*}) so the Google identity
      # provider uses the same OAuth app as the calendar integration.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-dourak.json:/opt/keycloak/data/import/realm-dourak.json:ro

volumes:
  postgres-data:
