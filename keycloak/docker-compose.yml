# Production Keycloak for the Google Cloud e2-micro VM (1 GB RAM).
# Run from this directory: docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HOSTNAME: https://${KC_HOSTNAME:?set KC_HOSTNAME in .env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      # The default heap sizing assumes far more memory than the free VM has.
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
      # Read by the realm import placeholders in realms/*.json.
      DOURAK_APP_URL: ${DOURAK_APP_URL:?set DOURAK_APP_URL in .env}
      KC_DOURAK_CLIENT_SECRET: ${KC_DOURAK_CLIENT_SECRET:?set KC_DOURAK_CLIENT_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:?set KC_SMTP_PASSWORD in .env}
      KC_SMTP_FROM: ${KC_SMTP_FROM:?set KC_SMTP_FROM in .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - keycloak
    ports:
      - "80:80"
      - "443:443"
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME:?set KC_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
