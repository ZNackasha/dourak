# Production Keycloak for an Oracle Cloud Always Free VM, backed by a managed
# MySQL HeatWave DB system. Run from this directory: docker compose up -d --build
services:
  keycloak:
    build:
      context: .
      pull: true
    restart: unless-stopped
    environment:
      KC_DB_URL: ${KC_DB_URL:?set KC_DB_URL in .env}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?set KC_DB_USERNAME in .env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HOSTNAME: https://${KC_HOSTNAME:?set KC_HOSTNAME in .env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      # Keycloak otherwise sizes its heap from total host RAM, not its own needs.
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx1g
      # Read by the realm import placeholders in realms/*.json.
      DOURAK_APP_URL: ${DOURAK_APP_URL:?set DOURAK_APP_URL in .env}
      KC_DOURAK_CLIENT_SECRET: ${KC_DOURAK_CLIENT_SECRET:?set KC_DOURAK_CLIENT_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:?set KC_SMTP_PASSWORD in .env}
      KC_SMTP_FROM: ${KC_SMTP_FROM:?set KC_SMTP_FROM in .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - keycloak
    ports:
      - "80:80"
      - "443:443"
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME:?set KC_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
